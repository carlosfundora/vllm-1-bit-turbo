name: amd-local-ci

on:
  pull_request:
    paths:
      - 'vllm/**'
      - 'tests/**'
      - 'examples/**'
      - 'tools/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/amd-local-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amd-local-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect AMD/kernel-relevant changes
    runs-on: ubuntu-latest
    outputs:
      rocm: ${{ steps.filter.outputs.rocm }}
      kernel: ${{ steps.filter.outputs.kernel }}
      quant: ${{ steps.filter.outputs.quant }}
      cache: ${{ steps.filter.outputs.cache }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          else
            changed="$(git diff --name-only HEAD~1...HEAD || true)"
          fi
          rocm=false
          kernel=false
          quant=false
          cache=false
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              *amd*|*AMD*|*rocm*|*ROCm*|*ROCM*|*hip*|*HIP*|*aiter*|*AITER*) rocm=true; kernel=true ;;
            esac
            case "$file" in
              *triton*|*Triton*|*flash*|*Flash*|*attention*|*Attention*) kernel=true ;;
            esac
            case "$file" in
              *quant*|*Quant*|*turboquant*|*TurboQuant*|*rotorquant*|*RotorQuant*|*modelopt*|*awq*|*AWQ*) quant=true ;;
            esac
            case "$file" in
              *cache*|*Cache*|*prefix*|*Prefix*|*radix*|*Radix*|*paged*|*Paged*) cache=true ;;
            esac
          done <<< "$changed"
          printf '%s\n' "$changed"
          echo "rocm=$rocm" >> "$GITHUB_OUTPUT"
          echo "kernel=$kernel" >> "$GITHUB_OUTPUT"
          echo "quant=$quant" >> "$GITHUB_OUTPUT"
          echo "cache=$cache" >> "$GITHUB_OUTPUT"

  rocm-pytorch-smoke:
    name: ROCm/PyTorch smoke
    needs: detect
    if: github.event_name == 'workflow_dispatch' || needs.detect.outputs.rocm == 'true' || needs.detect.outputs.kernel == 'true' || needs.detect.outputs.quant == 'true' || needs.detect.outputs.cache == 'true'
    runs-on: [self-hosted, linux, x64, amd, rocm, hip, gfx1030]
    timeout-minutes: 45
    env:
      HSA_OVERRIDE_GFX_VERSION: '10.3.0'
      AMDGPU_TARGETS: gfx1030
      PYTORCH_ROCM_ARCH: gfx1030
      ROCM_PATH: /opt/rocm
      HIP_PATH: /opt/rocm
    steps:
      - uses: actions/checkout@v5
      - name: Show ROCm environment
        run: |
          rocminfo | head -n 80 || true
          hipconfig || true
      - name: PyTorch and optional kernel imports
        run: |
          python - <<'PY'
          import importlib.util
          import torch
          print('torch:', torch.__version__)
          print('rocm/cuda available:', torch.cuda.is_available())
          if torch.cuda.is_available():
              print('device:', torch.cuda.get_device_name(0))
          for name in ['aiter', 'triton', 'flash_attn', 'vllm']:
              print(name, bool(importlib.util.find_spec(name)))
          PY

  kernel-path-smoke:
    name: Kernel/cache/quant path smoke
    needs: detect
    if: github.event_name == 'workflow_dispatch' || needs.detect.outputs.kernel == 'true' || needs.detect.outputs.quant == 'true' || needs.detect.outputs.cache == 'true'
    runs-on: [self-hosted, linux, x64, amd, rocm, hip, gfx1030]
    timeout-minutes: 45
    env:
      HSA_OVERRIDE_GFX_VERSION: '10.3.0'
      AMDGPU_TARGETS: gfx1030
      PYTORCH_ROCM_ARCH: gfx1030
    steps:
      - uses: actions/checkout@v5
      - name: Compile vLLM kernel/cache/quant Python paths
        run: |
          python -m compileall vllm || true
