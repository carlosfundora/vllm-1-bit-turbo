name: portable-python

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "10 8 * * *"

permissions:
  contents: read

concurrency:
  group: vllm-1-bit-turbo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest ruff mypy

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy vllm

      - name: Import smoke
        run: python -c "import vllm; print('ok')"

      - name: CPU-safe tests
        run: pytest -q -m "not slow_test and not distributed"

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vllm-1-bit-turbo-failure-${{ matrix.python-version }}
          path: |
            .pytest_cache
            **/*.log
          if-no-files-found: ignore
